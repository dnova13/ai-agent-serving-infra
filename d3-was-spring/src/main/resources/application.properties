spring.application.name=was
server.port=8080

# Kafka: docker-compose \uC758 EXTERNAL \uB9AC\uC2A4\uB108 (\uD638\uC2A4\uD2B8\uC5D0\uC11C \uC811\uC18D\uD558\uB294 \uC8FC\uC18C)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
# [NEW] Kafka \uAC00 \uAEBC\uC838 \uC788\uC744 \uB54C send() \uAC00 \uBA54\uD0C0\uB370\uC774\uD130\uB97C \uAE30\uB2E4\uB9AC\uB294 \uCD5C\uB300 \uC2DC\uAC04. \uAE30\uBCF8 60\uCD08\uB77C \uADF8\uB300\uB85C \uB450\uBA74 \uC694\uCCAD\uC774 1\uBD84 \uAC00\uAE4C\uC774 \uBA48\uCD98\uB2E4.
#       app.kafka.send-timeout-ms \uC640 \uAC19\uAC8C \uB9DE\uCD98\uB2E4.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# \uC571 \uC124\uC815 (kafka-ui \uB294 8090 \uC73C\uB85C \uC62E\uACA8 \uB450\uC5C8\uB2E4. docker-compose.yml)
app.kafka.topics.requests=agent.requests
# Day 18, 34 \uC5D0\uC11C \uD30C\uD2F0\uC158 \uC218\uB97C \uB298\uB9B4 \uB54C \uBC14\uAFBC\uB2E4
#app.kafka.topics.requests-partitions=1
app.kafka.topics.requests-partitions=3
app.kafka.send-timeout-ms=5000

# Day 26 sync experiment (POST /api/agent/sync): wait for FastAPI /api/v1/agent/run and relay the result
# timeout-ms: 504 when FastAPI does not answer within this time. connect-timeout-ms: 502 when it cannot be reached.
app.sync.fastapi-url=http://localhost:8000
app.sync.timeout-ms=30000
app.sync.connect-timeout-ms=2000

# Day 30: Prometheus metrics (GET /actuator/prometheus)
# expose only health and prometheus endpoints
management.endpoints.web.exposure.include=health,prometheus
# publish histogram buckets for http.server.requests so Grafana can compute p95/p99 (histogram_quantile)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# tomcat thread metrics (tomcat_threads_busy_threads etc.)
server.tomcat.mbeanregistry.enabled=true
# common tag on every metric
management.metrics.tags.application=was
