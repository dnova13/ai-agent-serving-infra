<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="935" viewBox="0 0 1120 935" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
<marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="1120" height="935" fill="#ffffff"/>
<text x="560.0" y="34" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">같은 세션(s1)에 요청 A, B 가 동시에 오면 — Redis 락의 흐름</text>
<rect x="60" y="56" width="220" height="56" rx="10" fill="#2563eb" />
<text x="170" y="80" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">요청 A</text>
<text x="170" y="100" font-size="13" fill="#fff" text-anchor="middle" font-weight="400">먼저 도착한 쪽</text>
<rect x="840" y="56" width="220" height="56" rx="10" fill="#d97706" />
<text x="950" y="80" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">요청 B</text>
<text x="950" y="100" font-size="13" fill="#fff" text-anchor="middle" font-weight="400">나중에 도착한 쪽</text>
<rect x="450" y="56" width="220" height="56" rx="10" fill="#6b7280" />
<text x="560" y="80" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">Redis</text>
<text x="560" y="100" font-size="13" fill="#fff" text-anchor="middle" font-weight="400">키 agent:lock:conversation:s1</text>
<line x1="170" y1="112" x2="170" y2="875" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6" opacity="0.55"/>
<line x1="560" y1="112" x2="560" y2="875" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6" opacity="0.55"/>
<line x1="950" y1="112" x2="950" y2="875" stroke="#d97706" stroke-width="2" stroke-dasharray="6 6" opacity="0.55"/>
<circle cx="34" cy="170" r="15" fill="#111827"/>
<text x="34" y="175" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<rect x="465" y="153" width="190" height="34" rx="17" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="560" y="175" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">lock:s1 = tokA</text>
<line x1="170" y1="170" x2="465" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#mb)"/>
<text x="317.5" y="160" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">SET lock:s1 tokA NX PX</text>
<text x="180" y="200" font-size="14" fill="#15803d" text-anchor="start" font-weight="700">→ 성공 (키가 없어서 만들어짐 = 락을 잡음)</text>
<circle cx="34" cy="260" r="15" fill="#111827"/>
<text x="34" y="265" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<rect x="465" y="243" width="190" height="34" rx="17" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="560" y="265" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">lock:s1 = tokA</text>
<line x1="950" y1="260" x2="655" y2="260" stroke="#d97706" stroke-width="2.5" marker-end="url(#mo)"/>
<text x="802.5" y="250" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">SET lock:s1 tokB NX PX</text>
<text x="940" y="290" font-size="14" fill="#dc2626" text-anchor="end" font-weight="700">→ 실패 (키가 이미 있음)</text>
<circle cx="34" cy="350" r="15" fill="#111827"/>
<text x="34" y="355" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<rect x="650" y="318" width="380" height="76" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
<text x="840.0" y="344" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">B 는 에러로 끝나지 않는다</text>
<text x="840.0" y="368" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">0.1초 쉬고 다시 시도, 계속 실패 (최대 100초)</text>
<rect x="65" y="225" width="210" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="170" y="256" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">A 가 처리 중</text>
<text x="170" y="288" font-size="14" fill="#111827" text-anchor="middle" font-weight="400">① 이전 대화 읽기 (없음)</text>
<text x="170" y="314" font-size="14" fill="#111827" text-anchor="middle" font-weight="400">③ 모델 호출 (수 초)</text>
<text x="170" y="340" font-size="14" fill="#111827" text-anchor="middle" font-weight="400">⑤ 질문과 답 저장 [Qa, Aa]</text>
<circle cx="34" cy="470" r="15" fill="#111827"/>
<text x="34" y="475" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<rect x="465" y="453" width="190" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="560" y="475" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">lock:s1 = (없음)</text>
<line x1="170" y1="470" x2="465" y2="470" stroke="#2563eb" stroke-width="2.5" marker-end="url(#mb)"/>
<text x="317.5" y="460" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">락 풀기: 값이 tokA 일 때만 DEL</text>
<text x="180" y="500" font-size="14" fill="#6b7280" text-anchor="start" font-weight="700">→ 키가 지워짐</text>
<circle cx="34" cy="580" r="15" fill="#111827"/>
<text x="34" y="585" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<rect x="465" y="563" width="190" height="34" rx="17" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="560" y="585" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">lock:s1 = tokB</text>
<line x1="950" y1="580" x2="655" y2="580" stroke="#d97706" stroke-width="2.5" marker-end="url(#mo)"/>
<text x="802.5" y="570" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">SET lock:s1 tokB NX PX (다시 시도)</text>
<text x="940" y="610" font-size="14" fill="#15803d" text-anchor="end" font-weight="700">→ 성공 (키가 없어서 만들어짐)</text>
<rect x="815" y="635" width="270" height="150" rx="10" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
<text x="950" y="666" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">B 가 처리 중</text>
<text x="950" y="698" font-size="14" fill="#111827" text-anchor="middle" font-weight="400">① 이전 대화 읽기 → [Qa, Aa] 를 봄</text>
<text x="950" y="724" font-size="14" fill="#111827" text-anchor="middle" font-weight="400">③ 모델 호출 (A 의 질문과 답까지 보고 답함)</text>
<text x="950" y="750" font-size="14" fill="#111827" text-anchor="middle" font-weight="400">⑤ 질문과 답 저장 [Qa, Aa, Qb, Ab]</text>
<circle cx="34" cy="840" r="15" fill="#111827"/>
<text x="34" y="845" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">6</text>
<rect x="465" y="823" width="190" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="560" y="845" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">lock:s1 = (없음)</text>
<line x1="950" y1="840" x2="655" y2="840" stroke="#d97706" stroke-width="2.5" marker-end="url(#mo)"/>
<text x="802.5" y="830" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">락 풀기: 값이 tokB 일 때만 DEL</text>
<text x="560.0" y="907" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="400">A 가 먼저 도착해 락을 잡았을 뿐이다. B 가 먼저 도착했다면 역할이 바뀐다. 다른 세션(s2)은 락 키가 달라서 이 줄 서기와 무관하다.</text>
</svg>